name: deploy

on:
  push:
    branches: [main]


jobs:
  validate: 
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0 # all history on github
      
      - name: Scan for leaked secrets
        run:  docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 detect --source=/repo --no-banner --redact

      - name: Check docker-compose.yml
        run:  docker compose --env-file .env_example config --quiet
      
      - name: Check the Nginx template
        run: |
          docker compose --env-file .env_example run --rm --no-deps -T --entrypoint sh nginx -c '
            /docker-entrypoint.d/20-envsubst-on-templates.sh &&
            grep -q signal.example.com /etc/nginx/nginx.conf &&
            echo "127.0.0.1 certbot nginx-terminate mtproxy" >> /etc/hosts &&
            nginx -t
          '
      - name: Lint the Ansible playbook
        continue-on-error: true
        run: |
          pipx install ansible-lint
          ansible-galaxy collection install community.general --force
          cd ansible && ansible-lint playbook.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Preparing the key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      
      - name: Deploying the VPS
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ~/proxy-stack && git pull --ff-only && docker compose up -d && docker compose restart nginx && docker compose ps"
      
    # Up to 6 tries: Nginx has just restarted 
    # -connect: the VPS / -servername: the SNI used by Nginx to route
    # -verify_hostname: the certificate must match this domain
      - name: Check services answer
        env: 
          HOST: ${{ secrets.VPS_HOST }}
          SIGNAL_DOMAIN: ${{ secrets.SIGNAL_DOMAIN }}
          MTPROXY_DOMAIN: ${{ secrets.MTPROXY_DOMAIN }}
        run: |
          check() {
            for i in 1 2 3 4 5 6; do
              if echo | timeout 10 openssl s_client -connect "$HOST:443" -servername "$1" -verify_hostname "$1" 2>/dev/null | grep -q "Verify return code: 0"; then
                return 0
              fi
              sleep 5
            done
            return 1
          }
          check "$SIGNAL_DOMAIN"  || { echo "Signal KO";  exit 1; }
          echo "Signal OK"
          check "$MTPROXY_DOMAIN" || { echo "MTProxy KO"; exit 1; }
          echo "MTProxy OK"