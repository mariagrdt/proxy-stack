name: deploy

on:
  push:
    branches: [main]


jobs:
  validate: 
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check docker-compose.yml
        run:  docker compose --env-file .env_example config --quiet
      
      - name: Check the Nginx template
        run: |
          docker compose --env-file .env_example run --rm --no-deps -T --entrypoint sh nginx -c '
            /docker-entrypoint.d/20-envsubst-on-templates.sh &&
            grep -q signal.example.com /etc/nginx/nginx.conf &&
            echo "127.0.0.1 certbot nginx-terminate mtproxy" >> /etc/hosts &&
            nginx -t
          '
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Preparing the key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
      
      - name: Deploying the VPS
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.VPS_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd ~/proxy-stack && git pull --ff-only && docker compose up -d && docker compose restart nginx && docker compose ps"