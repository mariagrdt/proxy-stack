services:
  

  # MAIN NGINX (ENTER POINT)

  nginx:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      SIGNAL_DOMAIN: ${SIGNAL_DOMAIN}
      MTPROXY_DOMAIN: ${MTPROXY_DOMAIN}
    ports:
      - "443:443"
      - "80:80"
    depends_on:
      - certbot
      - nginx-terminate
      - mtproxy

# CERTIFICATES (Let's Encrypt, shared)

  certbot:
    image: certbot/certbot@sha256:bc93cb710b413e6b456d622f9b0133b3e109c0a78c2ed9976af43d209b0a1805
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  
  
  # CONFIG MTPROXY (Telegram)

  mtproxy:
    image: nineseconds/mtg@sha256:9553495b5216cbe6b238e88ce8a3d43ef582e4dc45fcdd7a14d54497500f5d4f
    restart: unless-stopped
    command: simple-run -i prefer-ipv4 0.0.0.0:3128 ${MTG_SECRET}
  
  # CONFIG SIGNAL

  nginx-terminate:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    restart: unless-stopped
    volumes:
      - ./signal/data/nginx-terminate:/usr/conf.d
      - ./certbot/conf:/etc/letsencrypt:ro
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; /usr/sbin/nginx -s reload; done & /usr/sbin/nginx -c /usr/conf.d/nginx.conf -g \"daemon off;\"'"
  
  nginx-relay:
    image: nginx:stable-alpine@sha256:0e52bd054126cdc040b1276c0af347aeb02a41b9cfe305d6094767ac30e97949
    restart: unless-stopped
    volumes:
      - ./signal/data/nginx-relay:/usr/conf.d
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; /usr/sbin/nginx -s reload; done & /usr/sbin/nginx -c /usr/conf.d/nginx.conf -g \"daemon off;\"'"
  
