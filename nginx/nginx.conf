user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

stream {

    # Port 80 - everything goes to nginx-terminate (Let's Encrypt)
    server {
        listen  80;
        proxy_pass nginx-terminate:80;
    }

    # Port 443 (all other connexions)
    server {
        listen 443;
        proxy_pass nginx-terminate:443;
    }
}